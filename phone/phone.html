<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JARVIS · Phone</title><link rel="stylesheet" href="/phone.css"><style>.phone-brand{display:flex;align-items:center;gap:12px;border-bottom:1px solid #1c1f2b}.phone-brand img{width:38px;height:38px}.phone-brand small{display:block;color:#c0c6d4;letter-spacing:.18em}.phone-brand h1{margin:6px 0 2px;color:#f3f7fa}.phone-brand p{margin:0;color:#8d9caf;font-size:13px}</style></head><body>
<header class="phone-brand"><img src="/assets/branding/teague/teague-mark.svg" alt="" aria-hidden="true"><div><small>TEAGUE INDUSTRIES</small><h1>JARVIS</h1><p>Personal intelligence system.</p></div></header>
<main><section aria-labelledby="connection"><h2 id="connection">Connect this phone</h2><label for="key">Device key</label><input id="key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false"><p class="hint">Use the phone device key created on your PC, not an AI API key. It stays in this tab’s memory.</p><button id="connect">Connect</button><button id="disconnect" class="secondary">Disconnect</button></section>
<section><h2>Capture a task</h2><label for="title">Task title</label><input id="title" maxlength="500" placeholder="What needs doing?"><button id="save" disabled>Save task</button><p id="status" role="status" aria-live="polite">Not connected.</p></section>
<section><div class="heading"><h2>Shared tasks</h2><button id="refresh" class="secondary" disabled>Refresh</button></div><ul id="tasks"></ul></section></main><script src="/phone.js"></script></body></html>
